<!doctype html>
<html lang="zh-CN" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="Chat interface" />
    <meta name="application-name" content="Chat" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chat" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a1a" />
    <link rel="manifest" href="/manifest.webmanifest?v=lifeos-astronaut-v2" />
    <link rel="icon" href="/lifeos-astronaut-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/lifeos-astronaut-apple-touch-icon.png" />
    <title>Chat</title>
    <script>
      // 在 React 渲染前应用已保存的外观，避免启动 PWA 时先闪现错误的明暗与配色。
      // 迁移表必须与 lib/appearance.ts 的 migrateV1Appearance 保持一致（mobile-pwa-layout.test.mjs 门禁逐格校验）。
      (function () {
        var DARK_PRESETS = ["graphite", "obsidian", "dracula"];
        var MIGRATION = {
          paper: { classic: ["paper", "paper"], ocean: ["glacier", "glacier"], rose: ["peach", "peach"], orchid: ["glacier", "dracula"], instagram: ["instagram", "instagram"] },
          glass: { classic: ["glacier", "obsidian"], ocean: ["glacier", "obsidian"], rose: ["peach", "peach"], orchid: ["glacier", "dracula"], instagram: ["instagram", "instagram"] }
        };
        function resolvePreset() {
          try {
            var saved = JSON.parse(localStorage.getItem("chat:appearance:v2") || "null");
            if (saved && saved.version === 2 && DARK_PRESETS.concat(["paper", "glacier", "peach", "instagram"]).indexOf(saved.preset) >= 0) return saved.preset;
          } catch (_error) { /* fall through to v1 */ }
          try {
            var v1 = JSON.parse(localStorage.getItem("chat:appearance:v1") || "null");
            if (!v1 || typeof v1 !== "object") return null;
            var preference = null;
            try { preference = localStorage.getItem("pi-theme"); } catch (_error) { /* light */ }
            var dark = preference === "dark"
              || ((preference == null || preference === "" || preference === "auto")
                && window.matchMedia("(prefers-color-scheme: dark)").matches);
            var material = v1.material === "glass" ? "glass" : "paper";
            var palette = MIGRATION[material][v1.palette] ? v1.palette : "classic";
            return MIGRATION[material][palette][dark ? 1 : 0];
          } catch (_error) { return null; }
        }
        try {
          var preset = resolvePreset();
          if (preset) {
            document.documentElement.dataset.preset = preset;
            document.documentElement.classList.toggle("dark", DARK_PRESETS.indexOf(preset) >= 0);
          }
        } catch (_error) {
          // 隐私浏览模式可能禁止访问存储；React 启动后还会重新解析一次外观。
        }
      })();
    </script>
    <script type="module">
      import { initializeAppearance } from "/lib/appearance.ts";
      initializeAppearance();
    </script>
  </head>
  <body translate="no" class="notranslate">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
