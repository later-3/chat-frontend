<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF9F7" />
    <title>Chat is offline</title>
    <style>
      :root {
        color-scheme: light;
        --bg:#FAF9F7; --text:#29272E; --text-muted:#605C69; --bg-panel:#F2F1EE; --border:#DBD7DF; --accent:#6551B8; --bg-hover:#EAE8E5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      :root[data-theme="dark"] { color-scheme:dark; --bg:#232327; --text:#efedf4; --text-muted:#c1bdc8; --bg-panel:#2b2b30; --border:#424047; --accent:#c5b7f0; --bg-hover:#36353c; }
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(100%, 420px);
        text-align: center;
      }

      img {
        width: 88px;
        height: 88px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.6;
      }

      button {
        margin-top: 24px;
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-panel);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        background: var(--bg-hover);
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
    <script>
      // Standalone offline shell cannot depend on the application bundle.
      const systemTheme = matchMedia("(prefers-color-scheme: dark)");
      function applyTheme() {
        let preference = "auto";
        try { preference = localStorage.getItem("pi-theme") || "auto"; } catch {}
        const dark = preference === "dark" || preference !== "light" && systemTheme.matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#232327" : "#FAF9F7";
      }
      applyTheme();
      systemTheme.addEventListener("change", applyTheme);
    </script>
  </head>
  <body>
    <main>
      <img src="/lifeos-astronaut-192x192.png" alt="" />
      <h1 id="offline-title">Chat is offline</h1>
      <p id="offline-description">Reconnect to the internet and try again.</p>
      <button id="offline-reconnect" type="button" onclick="location.reload()">Reconnect</button>
    </main>
    <script>
      function applyLanguage() {
        let locale = "en";
        try { if (localStorage.getItem("pi-locale") === "zh-CN") locale = "zh-CN"; } catch {}
        const chinese = locale === "zh-CN";
        document.documentElement.lang = locale;
        document.title = chinese ? "Chat 当前离线" : "Chat is offline";
        document.getElementById("offline-title").textContent = document.title;
        document.getElementById("offline-description").textContent = chinese ? "请恢复网络连接后重试。" : "Reconnect to the internet and try again.";
        document.getElementById("offline-reconnect").textContent = chinese ? "重新连接" : "Reconnect";
      }
      applyLanguage();
      window.addEventListener("storage", applyLanguage);
    </script>
  </body>
</html>
