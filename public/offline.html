<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>Chat 当前离线</title>
    <style>
      :root {
        color-scheme: light;
        --bg:#FFFFFF; --text:#20242C; --text-muted:#596273; --bg-panel:#F7F8FA; --border:#D8DDE6; --accent:#245FD6; --bg-hover:#EEF1F5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      :root[data-theme="dark"] { color-scheme:dark; --bg:#181A1E; --text:#E8EBF0; --text-muted:#ADB6C5; --bg-panel:#202329; --border:#383F4B; --accent:#8AB4FF; --bg-hover:#2B3039; }
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(100%, 420px);
        text-align: center;
      }

      img {
        width: 88px;
        height: 88px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.6;
      }

      button {
        margin-top: 24px;
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg-panel);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        background: var(--bg-hover);
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
    <script>
      // Standalone offline shell cannot depend on the application bundle.
      const systemTheme = matchMedia("(prefers-color-scheme: dark)");
      function applyTheme() {
        let preference = "auto";
        try { preference = localStorage.getItem("pi-theme") || "auto"; } catch {}
        const dark = preference === "dark" || preference !== "light" && systemTheme.matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#181A1E" : "#FFFFFF";
      }
      applyTheme();
      systemTheme.addEventListener("change", applyTheme);
    </script>
  </head>
  <body>
    <main>
      <img src="/lifeos-astronaut-192x192.png" alt="" />
      <h1>Chat 当前离线</h1>
      <p>请恢复网络连接后重试。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
